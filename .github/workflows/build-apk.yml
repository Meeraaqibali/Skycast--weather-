name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Save our custom main.dart
        run: cp lib/main.dart /tmp/custom_main.dart

      - name: Generate Android platform files
        run: flutter create --project-name weather_flutter --platforms=android .

      - name: Restore our custom main.dart
        run: cp /tmp/custom_main.dart lib/main.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: weather-flutter-apk
          path: build/app/outputs/flutter-apk/*.apk
