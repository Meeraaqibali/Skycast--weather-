name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'

      - name: Install Pillow
        run: pip install pillow --quiet

      - name: Generate app icon
        run: python3 scripts/generate_icon.py

      - name: Save our custom main.dart
        run: cp lib/main.dart /tmp/custom_main.dart

      - name: Generate Android platform files
        run: flutter create --project-name weather_flutter --platforms=android .

      - name: Restore our custom main.dart
        run: cp /tmp/custom_main.dart lib/main.dart

      - name: Patch native splash styles
        run: python3 scripts/patch_styles.py


      - name: Delete auto-generated test
        run: |
          rm -f test/widget_test.dart
          echo "void main() {}" > test/widget_test.dart

      - name: Patch AndroidManifest
        run: python3 scripts/patch_manifest.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: skycast-weather-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
